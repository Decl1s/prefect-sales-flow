name: Проверки локального конвейера Prefect
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_CACHE_DIR: .cache/uv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Установить закреплённый менеджер окружения
        run: python -m pip install uv==0.13.1
      - name: Восстановить окружение по lock-файлу
        run: uv sync --frozen --no-dev
      - name: Показать версии
        run: uv run --frozen python -c "import sys,prefect; print(sys.version); print(prefect.__version__)"
      - name: Проверить обработку и публикацию
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Проверить настоящий локальный Prefect
        run: uv run --frozen python scripts/smoke.py
      - name: Проверить исходники и собрать архив
        run: uv run --frozen python scripts/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-${{ matrix.os }}
          path: |
            artifacts/prefect-sales-flow-0.1.1.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
